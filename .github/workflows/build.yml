name: Build DNSTT VPN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Set NDK Environment
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install gomobile & Build AAR
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240905004752-a925a0281915
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240905004752-a925a0281915
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          cd go-core
          go mod tidy
          chmod +x build.sh
          ./build.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnstt-vpn-android7-plus
          path: android/app/build/outputs/apk/debug/app-debug.apk